# Checks on every push to main and every pull request. No AWS credentials: nothing here
# reaches AWS, pushes an image or changes infrastructure.
# Actions are pinned to full commit SHAs (the tag is in the comment), so a
# moved or compromised tag can't change what runs here.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # A throwaway PostgreSQL (the compose image, by digest) so tests/test_postgres.py runs too.
    # It lives only for this job and holds only test rows, so its password is a fixed placeholder.
    services:
      postgres:
        image: postgres:18.4-trixie@sha256:a02db8cac496f15b094798a38254f14d6e00741f709360e5e00bb6668ea31636
        env:
          POSTGRES_DB: phishdet
          POSTGRES_USER: phishdet
          POSTGRES_PASSWORD: ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U phishdet -d phishdet"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      # With this set the PostgreSQL tests run (or fail); they skip only when it's missing.
      TEST_DATABASE_URL: postgresql://phishdet:ci-only@127.0.0.1:5432/phishdet
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      # The same commands as the README.
      - name: Install
        run: |
          python -m venv .venv
          .venv/bin/pip install -r requirements-dev.txt

      - name: Tests
        run: .venv/bin/python -m pytest -q -rs

  image:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The same build as scripts/build_push.sh, without the push.
      - name: Build
        run: docker build --platform linux/amd64 --provenance=false --sbom=false --build-arg APP_VERSION=ci -t phishdet:ci .

      # Started with the same flags as on EC2 (terraform/app/user_data.sh.tftpl). No database or
      # cache is configured, so the app keeps its history in memory; /healthz must answer.
      - name: Start the container and check /healthz
        run: |
          docker run -d --name app -p 127.0.0.1:8000:8000 --read-only --tmpfs /tmp --cap-drop ALL \
            --security-opt no-new-privileges phishdet:ci
          for _ in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8000/healthz -o healthz.json && break
            sleep 1
          done
          docker logs app
          python3 -c 'import json; assert json.load(open("healthz.json")) == {"status": "ok"}'

  terraform:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.17.1
          terraform_wrapper: false

      - uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
        with:
          tflint_version: v0.65.0

      - name: Format
        run: terraform fmt -check -recursive terraform

      # No backend and no credentials: validate checks the configuration only.
      - name: Validate
        run: |
          for root in terraform/foundation terraform/app; do
            (cd "$root" && terraform init -backend=false -input=false && terraform validate)
          done

      - name: tflint
        env:
          GITHUB_TOKEN: ${{ github.token }} # tflint --init downloads the pinned AWS ruleset from GitHub
        run: |
          for root in terraform/foundation terraform/app; do
            (cd "$root" && tflint --init && tflint --format compact)
          done

  checkov:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # checkov's package lists Python 3.9-3.12, not 3.13, so this run on 3.12 is the authoritative one.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      # Every finding that isn't fixed has an inline skip with its reason; anything else fails.
      - name: checkov
        run: |
          python -m venv /tmp/checkov
          /tmp/checkov/bin/pip install checkov==3.4.0
          for root in terraform/foundation terraform/app; do
            (cd "$root" && /tmp/checkov/bin/checkov -d . --framework terraform --quiet --compact)
          done
