# Tests on every push to main and every pull request. No AWS credentials.
# Actions are pinned to full commit SHAs (the tag is in the comment), so a
# moved or compromised tag can't change what runs here.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      # The same commands as the README.
      - name: Install
        run: |
          python -m venv .venv
          .venv/bin/pip install -r requirements-dev.txt

      - name: Tests
        run: .venv/bin/python -m pytest -q
